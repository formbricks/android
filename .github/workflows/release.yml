# Publishes com.formbricks:android to Maven Central when a GitHub release is published.
# The version comes from the release tag; main only holds a placeholder. See RELEASING.md.
#
# build -> publish -> verify, nothing else: CI already ran on the commit being tagged.
# Every job is safe to re-run: publish skips a version Maven Central already has or is still
# validating or publishing from an earlier attempt.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

# Two runs for the same tag would race to upload the same version; queue them instead.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      # No Gradle cache in this workflow: a cache written by a PR run must not feed a release.
      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      # The only place the version is worked out; publish and verify take it from this job.
      - name: Take the version from the tag
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          version="$(python3 scripts/release/version.py --tag "$TAG" --prerelease "$PRERELEASE")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Fails a broken release before any credential is handed out. Nothing is passed on: the
      # Maven Central plugin in publish rebuilds the artifacts from the same tag.
      - name: Build the release AAR and POM
        env:
          ORG_GRADLE_PROJECT_releaseVersion: ${{ steps.version.outputs.version }}
        run: ./gradlew :android:bundleReleaseAar :android:generatePomFileForMavenPublication --no-configuration-cache

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: "temurin"
          java-version: "21"

      # Each attempt that uploads records its Portal deployment id in this artifact. The Portal
      # cannot look a deployment up by version, so this is how a re-run finds an upload that is
      # still being validated or published. Nothing matches on the first attempt.
      - name: Fetch the deployments earlier attempts uploaded
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: maven-central-deployments
          merge-multiple: true
          path: ${{ runner.temp }}/deployments

      # Maven Central never accepts a version twice, so a re-run after an upload must skip rather
      # than upload again. Besides the repository, this asks the Portal about the version and
      # about every recorded deployment: one that has not FAILED counts as present.
      - name: Check whether Maven Central already has this version
        id: existing
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          exists="$(python3 scripts/release/maven_central.py exists "$VERSION" \
            --deployment-ids-file "$RUNNER_TEMP/deployments/deployment-ids.txt")"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = "true" ]; then
            echo "::notice title=Publish skipped::com.formbricks:android:$VERSION is already on Maven Central or on its way"
          fi

      - name: Publish to Maven Central
        id: publish
        if: steps.existing.outputs.exists == 'false'
        # `shell: bash` adds pipefail, so a failed Gradle run still fails the step through `tee`.
        shell: bash
        run: ./gradlew :android:publishAndReleaseToMavenCentral --no-configuration-cache | tee "$RUNNER_TEMP/publish.log"
        env:
          ORG_GRADLE_PROJECT_releaseVersion: ${{ needs.build.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}

      # Also after a failed or cancelled publish: the upload may have gone through before it failed.
      - name: Record the deployment id
        if: always() && steps.publish.outcome != 'skipped'
        run: |
          mkdir -p "$RUNNER_TEMP/deployments"
          python3 scripts/release/maven_central.py deployment-ids "$RUNNER_TEMP/publish.log" \
            >> "$RUNNER_TEMP/deployments/deployment-ids.txt"

      - name: Keep the deployment ids for a re-run
        if: always() && steps.publish.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-central-deployments
          path: ${{ runner.temp }}/deployments/deployment-ids.txt
          if-no-files-found: ignore
          overwrite: true

  verify:
    name: Verify
    needs: [build, publish]
    runs-on: ubuntu-latest
    # The poll gives up after 45 minutes; the job timeout is only a backstop.
    timeout-minutes: 50
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Wait until apps can resolve the version from Maven Central
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 scripts/release/maven_central.py wait "$VERSION" --timeout-minutes 45
