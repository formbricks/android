version: 2

# Security updates only. We do not want Dependabot to keep dependencies up to date;
# a PR should only be opened when a Dependabot alert (vulnerability) can be fixed.
#
# `open-pull-requests-limit: 0` switches off *version* update PRs for an ecosystem.
# Security update PRs are not subject to that limit, so they keep being opened as long
# as "Dependabot security updates" is enabled in Settings > Advanced Security.
updates:
  # Gradle dependencies, including the gradle/libs.versions.toml version catalog.
  # Note: Dependabot *alerts* for Gradle need the dependency graph, which this repo
  # submits from .github/workflows/dependency-submission.yml.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
