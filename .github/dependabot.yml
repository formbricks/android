version: 2
updates:
  # Gradle dependencies, including the gradle/libs.versions.toml version catalog.
  # Note: Dependabot *alerts* for Gradle need the dependency graph, which this repo
  # submits from .github/workflows/dependency-submission.yml.
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
    ignore:
      # AGP 8.9.2 cannot consume these (they need a newer compileSdk / AGP); the test APK's
      # AAR-metadata check fails and every CI run goes red. Lift once the AGP 9 migration lands.
      - dependency-name: "androidx.core:core-ktx"
        versions: ["> 1.16.0"]
      - dependency-name: "com.squareup.okhttp3:*"
        versions: [">= 5.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
